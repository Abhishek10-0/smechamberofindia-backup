<!DOCTYPE html>
<html>
<head>

<title>Past Events | SME Chamber of India</title>

<script src="https://ajax.googleapis.com/ajax/libs/jquery/3.6.0/jquery.min.js"></script>

<script src="https://cdn.jsdelivr.net/npm/@fancyapps/ui@4.0/dist/fancybox.umd.js"></script>

<script src="https://ajax.googleapis.com/ajax/libs/jquery/3.6.0/jquery.min.js"></script>

<script>

$(document).ready(function(){

    loadEvents();

});

function loadEvents(){

    $("#result").html("<h3 style='text-align:center'>Loading Events...</h3>");

    $.ajax({

        url: "show_data.php",

        type: "GET",

        success: function(data){

            $("#result").html(data);

            // Reinitialize Fancybox after AJAX
            Fancybox.bind("[data-fancybox='gallery']", {});

        }

    });

}

</script>

</head>

<body>

<div id="result"></div>

</body>
</html>
